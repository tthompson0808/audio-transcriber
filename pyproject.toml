[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio_transcriber"
version = "0.2.0"
description = "Background meeting transcription + digest for Windows. Auto-pulls Teams transcripts via Graph, auto-records Zoom via WASAPI, accepts drag-drop audio/VTT, and exposes a queryable SQLite digest."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — Agentic Consulting" }
authors = [{ name = "Agentic Consulting", email = "tyler@agentconsult.ai" }]

dependencies = [
    "anthropic>=0.40",  # API fallback path only — primary synthesis is Claude Desktop via MCP
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "msal>=1.30",
    "httpx>=0.27",
    "keyring>=25",
    "mcp[cli]>=1.0",  # MCP server for Claude Desktop synthesis
]

[project.optional-dependencies]
windows = [
    "psutil>=6",
    "pygetwindow>=0.0.9",
    "watchdog>=4",
    "pyaudiowpatch>=0.2.12",
    "pystray>=0.19",
    "pillow>=10",
    "win10toast-click>=0.1.2",
]
test = [
    "pytest>=8",
]

[project.scripts]
audio_transcriber = "audio_transcriber.cli:main"

[tool.setuptools.packages.find]
include = ["audio_transcriber*"]

[tool.setuptools.package-data]
audio_transcriber = ["dashboard/templates/*.html", "dashboard/static/*", "CLAUDE.md"]
